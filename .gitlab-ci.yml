.npm:
  image: common-docker-central-remote.repo.gcloud.belgium.be/node:24-alpine
  tags:
    - docker

.sonar:
  image:
    name: common-docker-central-remote.repo.gcloud.belgium.be/sonarsource/sonar-scanner-cli:latest
    entrypoint: ['']
  tags:
    - shared
    - docker

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

stages:
  - open-api
  - test
  - report
  - sonar

generate-api-client:
  image: common-docker-central-remote.repo.gcloud.belgium.be/openapitools/openapi-generator-cli:v7.14.0
  stage: open-api
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - java -jar /opt/openapi-generator/modules/openapi-generator-cli/target/openapi-generator-cli.jar generate -i api-contract/openapi.yaml -g typescript-angular -o reuse/code/openapi --additional-properties fileNaming=kebab-case,withInterfaces=true --generate-alias-as-model
  artifacts:
    paths:
      - reuse/code/openapi/
  only:
    - merge_requests
    - develop

validate-generated-api:
  extends: .npm
  stage: test
  needs:
    - job: generate-api-client
      optional: true
  script:
    - echo "Validating generated API client files"
    - ls -la reuse/code/openapi/
    - echo "Checking if key files exist"
    - test -f reuse/code/openapi/api.module.ts || (echo "api.module.ts not found" && exit 1)
    - test -d reuse/code/openapi/api/ || (echo "api directory not found" && exit 1)
    - test -d reuse/code/openapi/model/ || (echo "model directory not found" && exit 1)
    - echo "Generated API client validation passed"
  only:
    - merge_requests
    - develop

.test_base:
  extends: .npm
  stage: test
  variables:
    NODE_OPTIONS: '--max-old-space-size=3072'
    CI: 'true'
  needs:
    - job: generate-api-client
      optional: true
  script:
    - npm ci
    - npm run $TEST_SCRIPT
  only:
    - merge_requests
    - develop

test:reuse:
  extends: .test_base
  variables:
    TEST_SCRIPT: 'test:wc:reuse'
  artifacts:
    paths:
      - reuse/coverage/
    expire_in: 1h

test:list:
  extends: .test_base
  variables:
    TEST_SCRIPT: 'test:wc:list'
  artifacts:
    paths:
      - wc-prescription-list/coverage/
    expire_in: 1h

test:details:
  extends: .test_base
  variables:
    TEST_SCRIPT: 'test:wc:details'
  artifacts:
    paths:
      - wc-prescription-details/coverage/
    expire_in: 1h

test:create:
  extends: .test_base
  variables:
    TEST_SCRIPT: 'test:wc:create'
  artifacts:
    paths:
      - wc-prescription-create/coverage/
    expire_in: 1h

test:mags:list:
  extends: .test_base
  variables:
    TEST_SCRIPT: 'test:mags:list'
  artifacts:
    paths:
      - wrappers/components/mags-prescription-list/coverage/
    expire_in: 1h

test:mags:details:
  extends: .test_base
  variables:
    TEST_SCRIPT: 'test:mags:details'
  artifacts:
    paths:
      - wrappers/components/mags-prescription-details/coverage/
    expire_in: 1h

merge:coverage:
  extends: .npm
  stage: report
  needs:
    - test:reuse
    - test:list
    - test:create
    - test:details
    - test:mags:list
    - test:mags:details
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run merge:coverage
    - npm run merge:report
  artifacts:
    paths:
      - coverage/
    expire_in: 1h
  only:
    - merge_requests
    - develop

sonar-report:
  extends: .sonar
  needs:
    - merge:coverage
  stage: sonar
  variables:
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
  script:
    - echo "Starting Sonar Reporting"
    - sonar-scanner -Dsonar.branch.name=$CI_COMMIT_REF_NAME -Dsonar.host.url=$SONAR_URL -Dsonar.projectKey=referral-prescription-web-components -Dsonar.login=$VAS_SONARQUBE_TOKEN -Dsonar.qualitygate.wait=true -Dsonar.sources=. -Dsonar.inclusions=**/*.ts,**/*.scss,**/*.html -Dsonar.exclusions=**/node_modules/**,**/*.spec.ts -Dsonar.tests=. -Dsonar.test.inclusions=**/*.spec.ts -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
  only:
    - merge_requests
    - develop
