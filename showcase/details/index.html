<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Referral Prescription - Details Showcase</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script src="../lib/keycloak.js"></script>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(window.location.search);

      // Setting the profile for the target environment
      globalThis.referralPrescriptionEnv = 'accHcp';

      // Setting the environment dynamically
      const keycloak = getKeycloakConfiguration();

      // Initialization of the authentication library
      keycloak
        .init({ onLoad: 'login-required', checkLoginIframe: false })
        .then(function () {
          console.log('id token', keycloak.idTokenParsed);

          // Creation of the custom element
          const details = document.createElement('nihdi-referral-prescription-details');

          // Language: from URL param or browser default
          const langParam = params.get('lang');
          details.lang =
            langParam ||
            (navigator.language.includes('nl') || navigator.language.includes('fr') ? navigator.language : 'nl-BE');

          // Intent
          details.intent = params.get('intent') || 'order';

          // Prescription identifier: prescriptionId takes priority over shortcode
          details.prescriptionId = params.get('prescriptionId') || params.get('shortcode') || '';

          // Patient SSIN
          details.patientSsin = (params.get('ssin') || '').replace(/[.-]/g, '');

          // Build user profile from URL params
          const hcpSsin = (params.get('hcpSsin') || '').replace(/[.-]/g, '');
          const hcpDiscipline = params.get('hcpDiscipline') || 'NURSE';
          const includeOrg = params.get('includeOrg') === 'true';
          const orgNihii = (params.get('orgNihii') || '').replace(/[.-]/g, '');

          // Callback method to get a token from the authentication library
          const exchangedToken = async audience => await exchangeToken(keycloak.token, keycloak.clientId, audience);

          details.services = {
            getAccessToken: audience => {
              if (audience) {
                return Promise.resolve(exchangedToken(audience));
              } else {
                return Promise.resolve(keycloak.token);
              }
            },
            getIdToken: () => {
              const userProfileData = {
                ssin: hcpSsin,
                firstName: 'John',
                lastName: 'Doe',
                gender: 'M',
              };

              if (includeOrg && orgNihii) {
                userProfileData.organizations = [
                  {
                    otdpharmacy: {
                      nihii: orgNihii,
                      name: 'Test Hospital',
                    },
                  },
                ];
              }

              userProfileData[hcpDiscipline.toLowerCase()] = {
                recognised: true,
                nihii11: '46843080001',
              };

              return { userProfile: userProfileData };
            },
          };

          /**
           * Handles the `wcDetailsEvent` emitted by the web component when the user clicks
           * the assignment button.
           *
           * The host must listen for this event and resolve the payload with a list of
           * caregivers to assign, or reject it if the assignment cannot be completed.
           *
           * @event wcDetailsEvent
           * @resolves {AssignCareGiverResource[]} The list of caregivers to assign.
           * @rejects {Error | string} If the assignment cannot be completed.
           */
          details.addEventListener('wcDetailsEvent', event => {
            console.log('Trigger wcDetailsEvent: ', event);
            try {
              const result = caregivers.map(cargeviver => ({
                ssin: cargeviver.value,
                role: cargeviver.role,
              }));

              event.detail.payload.resolve(result);
            } catch {
              event.detail.payload.reject('User cancelled caregiver assignment');
            }
          });

          // Listener function to get feedback from the Web Component after the prescription has been successfully created
          details.addEventListener('clickOpenDetail', prescriptionSummary => {
            console.log('Opening prescription details', prescriptionSummary.id);
            setTimeout(() => {
              alert('Opening prescription details for prescription with id ' + prescriptionSummary.id);
            }, 100);
          });

          // Adding the custom element to the HTML body
          document.body.append(details);
        })
        .catch(function () {
          alert('failed to initialize');
        });

      /**
       * Returns a new Keycloak configuration object for the current environment.
       *
       * This function creates and returns an instance of the Keycloak client
       * configured with the predefined parameters such as the Keycloak server URL,
       * realm, and client ID. This setup is typically used to initialize the Keycloak
       * JavaScript adapter in frontend applications.
       *
       * @function
       * @returns {Keycloak} A Keycloak instance configured with:
       *  - `url`: "https://authentication/server/auth/endpoint"
       *  - `realm`: "myRealm"
       *  - `clientId`: "myClientId"
       *
       */
      function getKeycloakConfiguration() {
        return new Keycloak({
          url: 'https://api-acpt.ehealth.fgov.be/auth',
          realm: 'healthcare',
          clientId: 'nihdi-uhmep-hcp',
        });
      }

      /**
       * Exchanges an existing access token for a new one using OAuth 2.0 Token Exchange (RFC 8693).
       *
       * @param {string} subjectToken - The token you want to exchange (typically an access token).
       * @param {string} clientId - The OAuth 2.0 client ID of the requesting application.
       * @param {string} audience - The target audience of the new token (e.g., a specific API).
       *
       * @returns {Promise<string>} A Promise that resolves to the new access token string.
       *
       * @throws Will throw an error if the token exchange fails or if the server responds with a non-200 status.
       */
      async function exchangeToken(subjectToken, clientId, audience) {
        const params = new URLSearchParams();
        params.append('grant_type', 'urn:ietf:params:oauth:grant-type:token-exchange');
        params.append('subject_token_type', 'urn:ietf:params:oauth:token-type:access_token');
        params.append('subject_token', subjectToken);
        params.append('client_id', clientId);

        if (audience) {
          params.append('audience', audience);
        }

        try {
          //TODO change this for other env
          const response = await fetch(
            'https://api-acpt.ehealth.fgov.be/auth/realms/healthcare/protocol/openid-connect/token',
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
              },
              body: params.toString(),
            }
          );
          if (!response.ok) {
            throw new Error(`Failed to fetch token: ${response.statusText}`);
          }
          const data = await response.json();
          console.log('Response JSON', data);
          return data['access_token'];
        } catch (err) {
          console.error('Token exchange error:', err);
          throw err;
        }
      }
    </script>

    <!-- Web component script -->
    <script
      type="module"
      src="@smals-belgium-shared/uhmep-prescription-details/build/uhmep-prescription-details.js"></script>
  </body>
</html>
