<mh-alert
  [usage]="severity()"
  [backgroundColor]="'color'"
  [alertTitle]="title() ? (title()! | translate) : undefined"
  [alertSubtitle]="subTitle() ? (subTitle()! | translate) : undefined"
  [dismissMode]="dismissMode()"
  [actionButton]="retry()"
  [buttonLabel]="'common.tryAgain' | translate"
  [buttonDisabled]="false"
  [startExpanded]="startExpanded()"
  (actionButtonClicked)="clickRetry.emit()"
  (closeButtonClicked)="clickClose.emit()">
  @if (resolvedMessage(); as message) {
    <div alert-details>
      @if (message.isTranslated) {
        <span [innerHTML]="message.value"></span>
      } @else {
        <span [innerHTML]="message.value | translate"></span>
      }
    </div>
  }

  @if (hasContent()) {
    <div alert-details>
      <ng-content></ng-content>
    </div>
  }
</mh-alert>
