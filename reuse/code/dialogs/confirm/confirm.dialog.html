<app-dialog-layout [title]="titleLabel ? (titleLabel | translate: params) : ''">
  <div dialog-content class="confirm-message">@if (messageLabel) { {{ messageLabel | translate: params }} }</div>

  <div #overrideActions dialog-actions-override class="confirm-actions">
    @if (okLabel) {
    <button type="button" matButton="filled" (click)="confirm()" data-cy="dialog-confirm-button">
      {{ okLabel | translate: params }}
    </button>
    } @if (cancelLabel) {
    <button type="button" matButton="outlined" mat-dialog-close data-cy="dialog-cancel-button">
      {{ cancelLabel | translate: params }}
    </button>
    }
  </div>
</app-dialog-layout>
