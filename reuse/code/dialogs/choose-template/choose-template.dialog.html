<app-dialog-layout [title]="'prescription.selectTemplate.prescriptionModel' | translate" (confirm)="submit()">
  <form dialog-content class="mat-typography" [formGroup]="formGroup" (ngSubmit)="submit()">
    @if (viewState$(); as viewState) { @if (viewState.status === LoadingStatus.LOADING || viewState.status ===
    LoadingStatus.UPDATING) {
    <app-overlay-spinner mode="dialog"></app-overlay-spinner>
    } @else if (viewState.status === LoadingStatus.SUCCESS) {
    <app-select-prescription-type
      [formGroup]="formGroup"
      [templates]="viewState.data?.templates || []"
      [models]="showModelField() ? viewState.data?.models?.content : undefined"
      [showTitle]="false"></app-select-prescription-type>
    } }
  </form>
</app-dialog-layout>
