<div class="dialog-title">
  <h1 mat-dialog-title cdkFocusInitial tabindex="-1">
    {{ title() }}
  </h1>
  <button mat-icon-button mat-dialog-close [aria-label]="'common.close' | translate">
    <mat-icon svgIcon="close" [aria-hidden]="true"></mat-icon>
  </button>
</div>

<div mat-dialog-content class="mat-dialog-content">
  @if (requiredSubTitle()) {
    <p class="validation"><span class="required">*</span>{{ 'common.mandatory' | translate }}</p>
  }
  <ng-content select="[dialog-content]"></ng-content>
</div>

<div mat-dialog-actions class="dialog-actions responsive-wrapper">
  <div class="action-buttons-group">
    <ng-content select="[dialog-actions-override]"></ng-content>

    @if (!hasOverride) {
      <button
        type="submit"
        matButton="filled"
        [disabled]="confirmDisabled()"
        (click)="onConfirm()"
        data-cy="dialog-confirm-button">
        {{ confirmText() | translate }}
      </button>

      <button type="button" matButton="outlined" [mat-dialog-close]="cancelData()" data-cy="dialog-cancel-button">
        {{ cancelText() | translate }}
      </button>
    }
  </div>
</div>
