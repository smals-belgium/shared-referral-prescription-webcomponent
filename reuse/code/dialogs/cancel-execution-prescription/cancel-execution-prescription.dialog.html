<div class="wrapper">
  <h1 mat-dialog-title>{{'prescription.cancelExecution.title' | translate}}</h1>
  <div mat-dialog-content>
    @if (error(); as resolvedError) {
    <app-alert
      [severity]="resolvedError.severity"
      [title]="resolvedError.title"
      [subTitle]="resolvedError.subTitle"
      [message]="resolvedError.message"
      [dismissible]="resolvedError.dismissible"
      [retry]="false"
      [errorId]="resolvedError.errorId"
      (clickClose)="dismissError()"></app-alert>
    }
    <div>
      {{'prescription.cancelExecution.message' | translate: { firstName: patient?.firstName ?? '', lastName:
      patient?.lastName ?? '', templateName: prescription.templateCode | templateName} }}
    </div>
  </div>
  <mat-dialog-actions align="end">
    <button type="submit" mat-flat-button (click)="cancelPrescriptionExecution()" data-cy="dialog-confirm-button">
      {{'common.confirm' | translate}}
    </button>
    <button type="button" mat-stroked-button [mat-dialog-close]="undefined" data-cy="dialog-prescription-cancel-button">
      {{'common.cancel' | translate}}
    </button>
  </mat-dialog-actions>

  @if(loading){
  <app-overlay-spinner mode="dialog"></app-overlay-spinner>
  }
</div>
