<app-dialog-layout
  [title]="'proposal.approve.dialog.title' | translate"
  [confirmDisabled]="formGroup.get('reason')?.invalid ?? false"
  (confirm)="approveProposal()">
  <form dialog-content (ngSubmit)="approveProposal()" [formGroup]="formGroup">
    @if (error(); as resolvedError) {
    <app-alert
      [severity]="resolvedError.severity"
      [title]="resolvedError.title"
      [subTitle]="resolvedError.subTitle"
      [message]="resolvedError.message"
      [dismissible]="resolvedError.dismissible"
      [retry]="false"
      [errorId]="resolvedError.errorId"
      (clickClose)="dismissError()"></app-alert>
    }
    <div class="mh-form-field">
      <label for="proposal-approve-reason">{{ 'proposal.approve.dialog.reason' | translate }}</label>
      <mat-form-field appearance="outline">
        <textarea
          id="proposal-approve-reason"
          [formControlName]="'reason'"
          matInput
          rows="5"
          data-cy="proposal-approve-reason-textarea"></textarea>
        @if (formGroup.get('reason')?.hasError('required')){
        <mat-error>{{ 'common.mandatory' | translate }}</mat-error>
        }
      </mat-form-field>
    </div>
    @if (loading) {
    <app-overlay-spinner mode="dialog"></app-overlay-spinner>
    }
  </form>
</app-dialog-layout>
